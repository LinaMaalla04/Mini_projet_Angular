<div class="item">
  <h3>{{ event().title }}</h3>
  <p>Catégorie : {{ event().category | uppercase }}</p>
  <p>Date : {{ event().date | date: 'dd/MM/yyyy' }}</p>
  <p>
    Prix :
    @if (event().price === 0) {
      Gratuit
    } @else {
      {{ event().price | currency: 'TND' : 'symbol' : '1.0-2' }}
    }
  </p>
  <button type="button" [class.active]="isFavorite()" (click)="onFavoriteClick()">
    @if (isFavorite()) {
      Retirer des favoris
    } @else {
      Ajouter aux favoris
    }
  </button>
  <a [routerLink]="['/events', event().id]">Voir les détails</a>
</div>
